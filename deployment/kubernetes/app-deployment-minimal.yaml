---
# Namespace for the application
apiVersion: v1
kind: Namespace
metadata:
  name: house-price-predictor
  labels:
    app: house-price-predictor

---
# ConfigMap for API environment variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: house-price-predictor
data:
  MODEL_PATH: "/app/models"
  LOG_LEVEL: "info"

---
# Model Service Deployment (MINIMAL - 1 replica)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  namespace: house-price-predictor
  labels:
    app: model-service
    version: v1
spec:
  replicas: 1  # MINIMAL: 1 replica
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
      - name: model-service
        image: mohamedadel9988/house-pricemodel:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: MODEL_PATH
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "256Mi"  # MINIMAL: reduced from 512Mi
            cpu: "100m"      # MINIMAL: reduced from 250m
          limits:
            memory: "512Mi"  # MINIMAL: reduced from 1Gi
            cpu: "250m"      # MINIMAL: reduced from 500m
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60  # INCREASED: for limited resources
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30  # INCREASED: for limited resources
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        volumeMounts:
        - name: model-storage
          mountPath: /app/models
      volumes:
      - name: model-storage
        emptyDir: {}
      restartPolicy: Always

---
# Model Service
apiVersion: v1
kind: Service
metadata:
  name: model-service
  namespace: house-price-predictor
  labels:
    app: model-service
spec:
  type: ClusterIP
  selector:
    app: model-service
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

---
# FastAPI Service Deployment (MINIMAL - 1 replica)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: house-price-predictor
  labels:
    app: api-service
    version: v1
spec:
  replicas: 1  # MINIMAL: 1 replica
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
      - name: api-service
        image: mohamedadel9988/fastapi:b89009d7291fcfc20f4ce57d8a9fb472472523eb
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: MODEL_SERVICE_URL
          value: "http://model-service:8000"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "128Mi"  # MINIMAL: reduced from 256Mi
            cpu: "50m"       # MINIMAL: reduced from 100m
          limits:
            memory: "256Mi"  # MINIMAL: reduced from 512Mi
            cpu: "150m"      # MINIMAL: reduced from 250m
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 60  # INCREASED: for limited resources
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30  # INCREASED: for limited resources
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      restartPolicy: Always

---
# API Service (ClusterIP)
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: house-price-predictor
  labels:
    app: api-service
spec:
  type: ClusterIP
  selector:
    app: api-service
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP

---
# API Load Balancer Service (External Access)
apiVersion: v1
kind: Service
metadata:
  name: api-service-lb
  namespace: house-price-predictor
  labels:
    app: api-service
spec:
  type: LoadBalancer
  selector:
    app: api-service
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
# NO HPA (Auto-scaling disabled for minimal setup with 1 replica)
# Add HPA only if you need automatic scaling
